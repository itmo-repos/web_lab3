<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://java.sun.com/jsf/facelets">

<h:head>
    <title>#{msg['index.title']}</title>

    <h:outputStylesheet library="css" name="index.css"/>
    <h:outputScript library="js" name="index.js" />
</h:head>

<h:body>
    <h:form id="mainForm" prependId="true">
        <p:panel header="#{msg['index.authorPanel.header']}" id="authorPanel" styleClass="author-panel">
            <h:panelGrid columns="2" style="width: 100%">
                <h:outputText value="#{msg['index.label.fio']}" style="font-weight: bold"/>
                <h:outputText value="#{msg['index.value.fio']}"/>
                
                <h:outputText value="#{msg['index.label.group']}" style="font-weight: bold"/>
                <h:outputText value="#{msg['index.value.group']}"/>
                
                <h:outputText value="#{msg['index.label.variant']}" style="font-weight: bold"/>
                <h:outputText value="#{msg['index.value.variant']}"/>
            </h:panelGrid>
            <h:button value="#{msg['index.button.toMain']}" outcome="goToMain"/>
        </p:panel>

        <div class="clock-container">
            <div class="date" id="date"></div>
            <div class="clock">
                <div class="hour hand" id="hour"></div>
                <div class="minute hand" id="minute"></div>
                <div class="seconds hand" id="seconds"></div>
                <img src="resources/clock_template.svg" alt="clock"/>
            </div>
        </div>

    </h:form>
</h:body> 

</html>
