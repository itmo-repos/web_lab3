# index.xhtml
index.title = Hello page
index.authorPanel.header = Author
index.label.fio = Full name:
index.value.fio = Tarasov Saveliy Dmitrievich
index.label.group = Group number:
index.value.group = P3206
index.label.variant = Variant number:
index.value.variant = 513789
index.button.toMain = Go to main

# mainPage.xhtml
mainPage.title = Main page
mainPage.label.x = Enter X (-3; 5):
mainPage.required.x = Set X value
mainPage.validator.x = Value must be in range [-3; 5]
mainPage.label.y = Select Y (selected:
mainPage.label.r = Select R:
mainPage.required.r = Set R value
mainPage.button.check = Check
mainPage.button.back = Back
mainPage.button.update = Update
mainPage.table.header.x = X
mainPage.table.header.y = Y
mainPage.table.header.r = R
mainPage.table.header.hit = Hit

# Java messages
error.xOutOfRange = Value must be in range from {0} to {1}
error.validation.x = X validation error: absolute value must not exceed 6
error.validation.y = Y validation error: absolute value must not exceed 6
error.validation.r = Validation error: R must be in range from 1 to 5
                    <h:outputLabel id="y-selection-label" for="y" value="#{msg['mainPage.label.y']} #{yBean.y}): "/>
                    <ui:repeat id="y" value="#{yBean.possibleRange}" var="i">
                        <h:commandLink value="#{i}" action="#{yBean.handleSelection}" styleClass="select-y">
                            <f:setPropertyActionListener target="#{yBean.y}" value="#{i}"/>
                            <f:ajax render="main-form:y-selection-label" />
                        </h:commandLink>
                    </ui:repeat>
                </div>

                <div class="form-group">
                    <h:outputLabel for="r" value="#{msg['mainPage.label.r']}"/>
                    <h:selectOneRadio id="r" value="#{rBean.r}" converter="bigDecimalConverter" required="true" requiredMessage="#{msg['mainPage.required.r']}" onclick="redrawChart()">
                        <f:ajax execute="@this"/>
                        <f:selectItems value="#{rBean.variantsList}" var="item" itemValue="#{item}" itemLabel="#{item}" id="r-select" />
                    </h:selectOneRadio>
                </div>

                <div class="form-group">
                    <h:message for="x" styleClass="error-message"/>
                </div>
                
                <div class="form-group">
                    <h:message for="r" styleClass="error-message"/>
                </div>

                <div class="buttons" id="button-panel">
                    <h:commandButton id="send-point" value="#{msg['mainPage.button.check']}" styleClass="submit-btn">
                        <f:ajax execute="@form" listener="#{resultsWrapperBean.addResult(xBean.x, yBean.y, rBean.r)}" render="@form results-table" onevent="handleCheck"/>
                    </h:commandButton>
                    <h:link value="#{msg['mainPage.button.back']}" outcome="goToHome"/>
                    <h:commandButton id="update-table" value="#{msg['mainPage.button.update']}" style="display: none;">
                        <f:ajax render="@form results-table"/>
                    </h:commandButton>
                </div>

            </h:form>
        </div>

        <div class="table-container">
            <h:dataTable id="results-table" var="result" value="#{resultsWrapperBean.results}" styleClass="result-table">
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="#{msg['mainPage.table.header.x']}"/>
                    </f:facet>
                    <h:outputText value="#{result.x}" converter = "roundingBigDecimalConverter"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="#{msg['mainPage.table.header.y']}"/>
                    </f:facet>
                    <h:outputText value="#{result.y}" converter = "roundingBigDecimalConverter"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="#{msg['mainPage.table.header.r']}"/>
                    </f:facet>
                    <h:outputText value="#{result.r}" converter = "roundingBigDecimalConverter"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="#{msg['mainPage.table.header.hit']}"/>
                    </f:facet>
                    <h:outputText value="#{result.hit}"/>
                </h:column>
            </h:dataTable>
        </div>

        <div class="graph-container">
            <svg width="800" height="800" viewBox="-55 -55 410 410" class="svg-chart" id="svg-chart">
                <!-- body -->

                <path d="M 150 150 L 150 210 A 60 60 0 0 1 90 150 L 150 150" class="graph-body" />
                <rect x="30" y="90" width="120" height="60" class="graph-body"/>
                <polygon points="150,150 150,270 210,150" class="graph-body"/>

                <!-- Y -->
                <line x1="150" y1="300" x2="150" y2="0" stroke="black"/>
                <line x1="145" y1="10" x2="150" y2="0" stroke="black"/>
                <line x1="155" y1="10" x2="150" y2="0" stroke="black"/>

                <line x1="155" y1="270" x2="145" y2="270" stroke="black"/>
                <line x1="155" y1="210" x2="145" y2="210" stroke="black"/>
                <line x1="155" y1="90" x2="145" y2="90" stroke="black"/>                    
                <line x1="155" y1="30" x2="145" y2="30" stroke="black"/>

                <text x="158" y="30" fill="black" class="y-axis-label">R</text>
                <text x="158" y="90" fill="black" class="y-axis-label">R/2</text>
                <text x="158" y="210" fill="black" class="y-axis-label">-R/2</text>
                <text x="158" y="270" fill="black" class="y-axis-label">-R</text>

                <!-- X -->
                <line x1="0" y1="150" x2="300" y2="150" stroke="black"/>
                <line x1="290" y1="155" x2="300" y2="150" stroke="black"/>
                <line x1="290" y1="145" x2="300" y2="150" stroke="black"/>


                <line x1="270" y1="155" x2="270" y2="145" stroke="black"/>
                <line x1="210" y1="155" x2="210" y2="145" stroke="black"/>
                <line x1="90" y1="155" x2="90" y2="145" stroke="black"/>
                <line x1="30" y1="155" x2="30" y2="145" stroke="black"/>

                <text x="30" y="142" fill="black" class="x-axis-label">-R</text>
                <text x="90" y="142" fill="black" class="x-axis-label">-R/2</text>
                <text x="210" y="142" fill="black" class="x-axis-label">R/2</text>
                <text x="270" y="142" fill="black" class="x-axis-label">R</text>

                <!-- axes names -->
                <text x="290" y="140" fill="black" class="axis-label">x</text>
                <text x="160" y="10" fill="black" class="axis-label">y</text>
            </svg>
        </div>
    </div>
    <div id="toast" class="toast"></div>
</h:body>

</html>
